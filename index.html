function preencherExemplo(){

  do { i = Math.floor(Math.random() * pool.length); }
  while (pool.length > 1 && i === ultimoExPorTipo[tipo]);

  ultimoExPorTipo[tipo] = i;
  const e = pool[i];

  ano.value = e.ano;
  nome.value = e.nome;
  funcao.value = e.funcao;

/* ===================== UTILITÁRIOS ===================== */
function escapeHtml(str){
  return (str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[m]));
}
function lista(txt){
  const items = (txt ?? "").split(";").map(t=>t.trim()).filter(Boolean);
  return items.length ? items.map(t=>"• "+escapeHtml(t)).join("<br>") : "—";
}

/* ===================== SIMULAÇÃO “IA A ESCREVER” ===================== */
function simulateAIGeneration(outEl, htmlFinal){
  const indicador = document.getElementById("gerando");

  if(typingTimer) { clearTimeout(typingTimer); typingTimer = null; }

  indicador.style.display = "block";
  isGenerating = true;
  setButtonsDisabled(true);

  edicaoAtiva = false;
  outEl.contentEditable = "false";
  outEl.classList.remove("editable");

  outEl.innerHTML = `<div id="typingPreview"></div>`;
  const previewEl = document.getElementById("typingPreview");

  const tmp = document.createElement("div");
  tmp.innerHTML = htmlFinal
    .replace(/<\/h1>/gi, "\n\n")
    .replace(/<\/h2>/gi, "\n")
    .replace(/<\/p>/gi, "\n\n")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/div>/gi, "\n")
    .replace(/<\/li>/gi, "\n");

  const fullText = (tmp.innerText || "").replace(/\n{3,}/g, "\n\n").trim();

  let i = 0;
  const base = 9;
  const jitter = () => Math.floor(Math.random() * 12);
  const pauseChance = () => Math.random() < 0.02;
  const pauseTime = () => 120 + Math.floor(Math.random()*220);

  function step(){
    if(i < fullText.length){
      previewEl.textContent = fullText.slice(0, i + 1);
      i++;

      let delay = base + jitter();
      const ch = fullText[i-1];
      if(ch === "." || ch === "," || ch === ";" || ch === ":") delay += 40 + jitter();
      if(ch === "\n") delay += 60 + jitter();
      if(pauseChance()) delay += pauseTime();

      typingTimer = setTimeout(step, delay);
    }else{
      outEl.innerHTML = htmlFinal;

      indicador.style.display = "none";
      isGenerating = false;
      setButtonsDisabled(false);
      typingTimer = null;
    }
  }
  step();
}

/* ===================== PRNG DETERMINÍSTICO ===================== */
function hashString(s){
  s = String(s ?? "");
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function makeRng(seed){
  let x = seed >>> 0;
  return function(){
    x ^= x << 13; x >>>= 0;
    x ^= x >> 17; x >>>= 0;
    x ^= x << 5;  x >>>= 0;
    return (x >>> 0) / 4294967296;
  };
}
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function pickNonRepeatingStart(rng, arr){
  for(let tries=0; tries<10; tries++){
    const cand = pick(rng, arr);
    const key = cand.slice(0, 46).toLowerCase();
    if(!recentStarts.includes(key)){
      recentStarts.push(key);
      while(recentStarts.length > RECENT_LIMIT) recentStarts.shift();
      return cand;
    }
  }
  const fb = pick(rng, arr);
  const key = fb.slice(0, 46).toLowerCase();
  recentStarts.push(key);
  while(recentStarts.length > RECENT_LIMIT) recentStarts.shift();
  return fb;
}

/* ===================== FUZZY MATCH ===================== */
function levenshtein(a,b){
  a = a || ""; b = b || "";
  const n=a.length, m=b.length;
  if(n===0) return m;
  if(m===0) return n;
  const dp = new Array(m+1);
  for(let j=0;j<=m;j++) dp[j]=j;
  for(let i=1;i<=n;i++){
    let prev = dp[0];
    dp[0] = i;
    for(let j=1;j<=m;j++){
      const temp = dp[j];
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[j] = Math.min(dp[j]+1, dp[j-1]+1, prev+cost);
      prev = temp;
    }
  }
  return dp[m];
}
function normalizeText(s){
  return (s ?? "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function tokens(s){
  const t = normalizeText(s);
  return t ? t.split(" ") : [];
}

const CANON_WORDS = (() => {
  const set = new Set();
  for(const th of THEMES){
    th.pos.forEach(w=>set.add(normalizeText(w)));
    th.neg.forEach(w=>set.add(normalizeText(w)));
  }
  return Array.from(set);
})();

function correctToken(tok){
  if(!tok || tok.length < 4) return tok;
  let best = tok, bestD = 99;
  const maxD = tok.length <= 6 ? 1 : 2;
  for(const w of CANON_WORDS){
    const d = levenshtein(tok, w);
    if(d < bestD){
      bestD = d; best = w;
      if(bestD===0) break;
    }
  }
  return (bestD <= maxD) ? best : tok;
}

function extractThemes(text){
  const raw = tokens(text).map(correctToken);
  const counts = {};
  THEMES.forEach(t=>counts[t.key]=0);

  for(const tok of raw){
    for(const th of THEMES){
      const pos = th.pos.map(normalizeText);
      const neg = th.neg.map(normalizeText);
      if(pos.includes(tok) || neg.includes(tok)){
        counts[th.key] += 1;
      }
    }
  }

  return Object.entries(counts)
    .filter(([,c])=>c>0)
    .sort((a,b)=>b[1]-a[1])
    .map(([k,c])=>({key:k,count:c,label:THEMES.find(t=>t.key===k).label}));
}

function extractAnchors(text){
  const t = (text ?? "").trim();
  if(!t) return [];
  const parts = t.replace(/\s+/g," ").split(/[.!?;]/).map(s=>s.trim()).filter(s=>s.length >= 18);
  const pool = parts.length ? parts : [t.slice(0, 90)];
  pool.sort((a,b)=>b.length-a.length);
  const a1 = pool[0] ? pool[0].slice(0, 110) : "";
  const a2 = pool[1] ? pool[1].slice(0, 90) : "";
  return [a1,a2].filter(Boolean);
}

function themesPhrase(rng, themes, kind){
  if(!themes.length){
    return kind==="pos"
      ? pick(rng, [
        "Foram identificados aspetos positivos relevantes, com contributo direto para a continuidade das operações.",

      : pick(rng, [

        "Existem áreas de desenvolvimento que deverão ser acompanhadas no próximo período, de forma progressiva."
      ]);
  }
  const top = themes.slice(0,3).map(t=>t.label);
  const join = top.length===1 ? top[0] : top.length===2 ? `${top[0]} e ${top[1]}` : `${top[0]}, ${top[1]} e ${top[2]}`;
  return kind==="pos"
    ? pick(rng, [

/* ===================== CÁLCULO PONDERADO ===================== */
function calcGlobal(tipo, res, qual, comp, evol){
  const w = PESOS[tipo] || PESOS.campo;
  const score = (res*w.res + qual*w.qual + comp*w.comp + evol*w.evol);
  return score;
}

function globalLabel(score){
  // score 1..5
  if(score >= 4.50) return "Excelente / Referência";
  if(score >= 3.75) return "Muito bom";
  if(score >= 3.00) return "Cumpre / Bom";
  if(score >= 2.25) return "A desenvolver";
  return "Abaixo do esperado";
}

/* ===================== CONCLUSÃO (com plano) ===================== */

  const themesStrong = extractThemes(`${fortesTxt} ${tGlobal}`);
  const themesImprove = extractThemes(`${melhorarTxt} ${tGlobal}`);
  const keep = themesPhrase(rng, themesStrong, "pos");
  const improve = themesPhrase(rng, themesImprove, "neg");
  const anchor = extractAnchors(`${tGlobal}`)[0];

  const s1 = pickNonRepeatingStart(rng, [
