<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte do Pasto — Avaliação Anual</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:#f4f5f2;
  color:#2b2b2b;
}
header{
  text-align:center;
  padding:28px 20px;
  background:#fff;
  border-bottom:1px solid #ccc;
}
header img{max-height:110px}
main{
  max-width:1120px;
  margin:0 auto;
  padding:28px 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}
@media(max-width:900px){main{grid-template-columns:1fr}}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:20px;
}
label{display:block;margin-top:12px;font-size:13px;color:#555}
input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}
textarea{min-height:90px}
button{
  margin-top:12px;
  margin-right:8px;
  padding:10px 16px;
  border-radius:20px;
  border:1px solid #ccc;
  background:#eee;
  cursor:pointer;
  font-weight:600;
}

.paper{
  background:#fff;
  padding:32px;
  border:1px solid #ccc;
  font-family:"Times New Roman", serif;
  line-height:1.65;
}

.footer-doc{
  margin-top:40px;
  padding-top:10px;
  border-top:1px solid #000;
  font-size:11pt;
  text-align:center;
}

#out.editable{
  outline:3px dashed #8da58f;
  outline-offset:6px;
}

.pdf-header{display:none}

@page{size:A4;margin:25mm 20mm}
@media print{
  header,.card.form,button{display:none}
  main{display:block;padding:0}
  .paper{border:none;padding:0}
  .pdf-header{
    display:flex;
    align-items:center;
    border-bottom:2px solid #000;
    padding-bottom:10px;
    margin-bottom:20px;
  }
  .pdf-header img{height:60px;margin-right:18px}
  .section{page-break-inside:avoid;margin-bottom:20px}
}
</style>
</head>

<body>

<header>
  <img src="logo-monte-do-pasto.png" alt="Monte do Pasto">
  <h2>Avaliação Anual de Colaboradores</h2>
</header>

<main>

<section class="card form">
  <label>ANO DA AVALIAÇÃO</label>
  <input id="ano" placeholder="Ex.: 2026">

  <label>Nome</label>
  <input id="nome">

  <label>Função</label>
  <input id="funcao">

  <label>Tipo de função</label>
  <select id="tipo">
    <option value="campo">Operacional / Campo</option>
    <option value="admin">Administrativa / Apoio</option>
    <option value="chefia">Chefia</option>
  </select>

  <label>Data</label>
  <input type="date" id="data">

  <label>Nível de Desempenho</label>
  <select id="nd">
    <option value="5">5 — Muito bom</option>
    <option value="4">4 — Bom</option>
    <option value="3" selected>3 — Suficiente</option>
    <option value="2">2 — Fraco</option>
    <option value="1">1 — Muito fraco</option>
  </select>

  <label>Nível de Atitude no Trabalho</label>
  <select id="na">
    <option value="5">5 — Muito boa</option>
    <option value="4">4 — Boa</option>
    <option value="3" selected>3 — Suficiente</option>
    <option value="2">2 — Fraca</option>
    <option value="1">1 — Muito fraca</option>
  </select>

  <label>Nível de Trabalho em Equipa</label>
  <select id="ne">
    <option value="5">5 — Muito bom</option>
    <option value="4">4 — Bom</option>
    <option value="3" selected>3 — Suficiente</option>
    <option value="2">2 — Fraco</option>
    <option value="1">1 — Muito fraco</option>
  </select>

  <label>Comentário sobre o desempenho</label>
  <textarea id="tTrab"></textarea>

  <label>Comentário sobre a atitude</label>
  <textarea id="tAti"></textarea>

  <label>Pontos fortes (;)</label>
  <textarea id="fortes"></textarea>

  <label>Aspetos a melhorar (;)</label>
  <textarea id="melhorar"></textarea>

  <button onclick="preencherExemplo()">Preencher com exemplo</button>
  <button onclick="gerar()">Gerar ficha</button>
  <button onclick="toggleEdicao()">Ativar edição do texto</button>
  <button onclick="window.print()">Imprimir / PDF</button>
</section>

<section class="card">
  <div class="paper" id="out">(Ficha por gerar)</div>
</section>

</main>

<script>
const labels={5:"Muito bom",4:"Bom",3:"Suficiente",2:"Fraco",1:"Muito fraco"};
let edit=false;
let ultimoExemplo=-1;

const exemplos=[
  {
    ano:"2026",
    nome:"João Silva",
    funcao:"Trabalhador Agrícola",
    tipo:"campo",
    nd:3, na:4, ne:3,
    tTrab:"Cumpre as tarefas com regularidade, mas precisa de melhorar a organização e o controlo do trabalho.",
    tAti:"Mantém uma atitude positiva e colaborativa, embora por vezes revele alguma resistência a alterações.",
    fortes:"responsabilidade; disponibilidade",
    melhorar:"organização; atenção ao detalhe"
  },
  {
    ano:"2026",
    nome:"Ana Costa",
    funcao:"Administrativa",
    tipo:"admin",
    nd:4, na:4, ne:4,
    tTrab:"Executa tarefas administrativas com rigor e autonomia, cumprindo prazos e procedimentos.",
    tAti:"Postura profissional consistente, com boa comunicação e espírito de colaboração.",
    fortes:"organização; comunicação; autonomia",
    melhorar:"priorização de tarefas"
  },
  {
    ano:"2026",
    nome:"Carlos Mendes",
    funcao:"Chefe de Equipa",
    tipo:"chefia",
    nd:4, na:3, ne:4,
    tTrab:"Coordena a equipa de forma eficaz, assegurando o cumprimento dos objetivos definidos.",
    tAti:"Mantém uma postura profissional, embora possa melhorar a gestão de conflitos.",
    fortes:"liderança; sentido de responsabilidade",
    melhorar:"gestão de conflitos; comunicação em situações de pressão"
  }
];

function preencherExemplo(){
  let i;
  do{i=Math.floor(Math.random()*exemplos.length)}while(i===ultimoExemplo);
  ultimoExemplo=i;
  const e=exemplos[i];
  ano.value=e.ano;
  nome.value=e.nome;
  funcao.value=e.funcao;
  tipo.value=e.tipo;
  data.value=new Date().toISOString().slice(0,10);
  nd.value=e.nd;
  na.value=e.na;
  ne.value=e.ne;
  tTrab.value=e.tTrab;
  tAti.value=e.tAti;
  fortes.value=e.fortes;
  melhorar.value=e.melhorar;
}

function toggleEdicao(){
  edit=!edit;
  const o=document.getElementById("out");
  o.contentEditable=edit;
  o.classList.toggle("editable",edit);
}

function gerar(){
  const g=id=>document.getElementById(id).value.trim();
  if(!/^\d{4}$/.test(g("ano"))){alert("Ano inválido");return;}

  const tipo=g("tipo");
  const contexto=
    tipo==="chefia"
      ? "num contexto de liderança, coordenação e tomada de decisão"
      : tipo==="admin"
        ? "no contexto administrativo e de apoio"
        : "no contexto operacional e de trabalho no terreno";

  const bloco=(t,n,txt)=>`
    <div class="section">
      <h2>${t}: ${n}/5 — ${labels[n]}</h2>
      <p>
        Durante o período avaliado, observou-se um nível ${labels[n].toLowerCase()} ${contexto}.
        ${txt || "A informação disponível permite enquadrar adequadamente este domínio da avaliação."}
        O desempenho registado contribui para a leitura global do período.
        Existem aspetos positivos a manter e oportunidades de melhoria a desenvolver.
        Recomenda-se acompanhamento contínuo e definição de prioridades claras.
        A consistência ao longo do tempo será determinante para a evolução.
        Este domínio deverá continuar a ser acompanhado no próximo ciclo.
      </p>
    </div>`;

  out.innerHTML=`
    <div class="pdf-header">
      <img src="logo-monte-do-pasto.png">
      <h1>Monte do Pasto — Avaliação Anual</h1>
    </div>

    <p>
      <strong>Ano:</strong> ${g("ano")}<br>
      <strong>Nome:</strong> ${g("nome")}<br>
      <strong>Função:</strong> ${g("funcao")}<br>
      <strong>Tipo de função:</strong> ${tipo}<br>
      <strong>Data:</strong> ${g("data")}
    </p>

    ${bloco("Nível de Desempenho",g("nd"),g("tTrab"))}
    ${bloco("Nível de Atitude no Trabalho",g("na"),g("tAti"))}
    ${bloco("Trabalho em Equipa",g("ne"),g("tAti"))}

    <div class="section">
      <h2>Conclusão e Objetivos</h2>
      <p>
        A presente avaliação sintetiza o período observado ${contexto}.
        Devem ser mantidos os pontos fortes identificados e trabalhadas as áreas de melhoria.
        Recomenda-se a definição de objetivos claros, realistas e acompanhados regularmente.
        Este documento serve de base para o próximo ciclo de avaliação.
      </p>
    </div>

    <div class="section">
      <p><strong>Data:</strong> ____________________________</p>
      <p><strong>Assinatura do Colaborador:</strong><br><br>______________________________</p>
      <p><strong>Assinatura da Chefia:</strong><br><br>______________________________</p>
    </div>

    <div class="footer-doc">
      TPL Avaliação Monte do Pasto
    </div>
  `;
}
</script>

</body>
</html>
