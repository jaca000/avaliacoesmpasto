<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte do Pasto — Avaliação Anual</title>

<style>
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    background:#f4f5f2;
    color:#2b2b2b;
  }
  header{
    text-align:center;
    padding:28px 20px;
    background:#fff;
    border-bottom:1px solid #ccc;
  }
  header img{max-height:110px}

  main{
    max-width:1120px;
    margin:0 auto;
    padding:28px 20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
  }
  @media(max-width:900px){main{grid-template-columns:1fr}}

  .card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
  }
  label{display:block;margin-top:12px;font-size:13px;color:#555}
  input,select,textarea{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
  }
  textarea{min-height:92px}

  .row3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  @media(max-width:900px){ .row3{grid-template-columns:1fr} }

  .mini{
    font-size:12px;
    color:#666;
    margin-top:6px;
    line-height:1.35;
  }
  .pill{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid #ddd;
    background:#fafafa;
    font-size:12px;
    color:#444;
    margin-top:8px;
  }
  .warn{
    border-color:#e0b4b4;
    background:#fff3f3;
    color:#9b2c2c;
  }

  .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{
    padding:10px 16px;
    border-radius:20px;
    border:1px solid #ccc;
    background:#eee;
    cursor:pointer;
    font-weight:600;
  }
  button:disabled{
    opacity:.6;
    cursor:not-allowed;
  }
  .hint{
    font-size:12px;color:#666;margin-top:10px;line-height:1.35
  }

  .paper{
    background:#fff;
    padding:32px;
    border:1px solid #ccc;
    font-family:"Times New Roman", serif;
    line-height:1.65;
  }

  #out.editable{
    outline:3px dashed #8da58f;
    outline-offset:6px;
    border-radius:6px;
  }

  .pdf-header{display:none}

  .footer-doc{
    margin-top:40px;
    padding-top:10px;
    border-top:1px solid #000;
    font-size:11pt;
    text-align:center;
  }

  #gerando{
    display:none;
    font-style:italic;
    color:#666;
    margin-bottom:12px;
  }

  #typingPreview{
    white-space:pre-wrap;
    font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size:12.5px;
    line-height:1.55;
    color:#444;
  }

  @page{size:A4;margin:25mm 20mm}
  @media print{
    header,.card.form,.btn-row,.hint,#gerando,.pill{display:none}
    main{display:block;padding:0}
    .paper{border:none;padding:0}
    .pdf-header{
      display:flex;
      align-items:center;
      border-bottom:2px solid #000;
      padding-bottom:10px;
      margin-bottom:18px;
    }
    .pdf-header img{height:60px;margin-right:18px}
    .section{margin-bottom:18px;page-break-inside:avoid}
    .section h2{
      margin:0 0 8px;
      font-size:14pt;
      border-bottom:1px solid #000;
      padding-bottom:4px;
    }
  }
</style>
</head>

<body>

<header>
  <img src="logo-monte-do-pasto.png" alt="Monte do Pasto">
  <h2>Avaliação Anual de Colaboradores</h2>
</header>

<main>

<section class="card form">
  <label>ANO DA AVALIAÇÃO (obrigatório)</label>
  <input id="ano" inputmode="numeric" placeholder="Ex.: 2026">

  <label>Nome</label>
  <input id="nome" placeholder="Nome do colaborador">

  <label>Função</label>
  <input id="funcao" placeholder="Função / Cargo">

  <label>Área (Tipo)</label>
  <select id="tipo">
    <option value="campo">CAMPO / OPERAÇÕES PECUÁRIAS</option>
    <option value="producao">PRODUÇÃO DE CARNE & LOGÍSTICA</option>
    <option value="vendas">VENDAS & MARKETING</option>
    <option value="contab">CONTABILIDADE</option>
    <option value="finpcg">FINANCEIRO & PLANEAMENTO E CONTROLO DE GESTÃO</option>
  </select>

  <label>Data</label>
  <input type="date" id="data">

  <label>Nível de Desempenho</label>
  <select id="nd">
    <option value="5">5 — Muito bom</option>
    <option value="4">4 — Bom</option>
    <option value="3" selected>3 — Suficiente</option>
    <option value="2">2 — Fraco</option>
    <option value="1">1 — Muito fraco</option>
  </select>

  <label>Nível de Atitude no Trabalho</label>
  <select id="na">
    <option value="5">5 — Muito boa</option>
    <option value="4">4 — Boa</option>
    <option value="3" selected>3 — Suficiente</option>
    <option value="2">2 — Fraca</option>
    <option value="1">1 — Muito fraca</option>
  </select>

  <label>Nível de Trabalho em Equipa</label>
  <select id="ne">
    <option value="5">5 — Muito bom</option>
    <option value="4">4 — Bom</option>
    <option value="3" selected>3 — Suficiente</option>
    <option value="2">2 — Fraco</option>
    <option value="1">1 — Muito fraco</option>
  </select>

  <label>Ponderações (%)</label>
  <div class="row3">
    <div>
      <label style="margin-top:0">Desempenho</label>
      <input id="w_nd" type="number" min="0" max="100" value="50">
    </div>
    <div>
      <label style="margin-top:0">Atitude</label>
      <input id="w_na" type="number" min="0" max="100" value="25">
    </div>
    <div>
      <label style="margin-top:0">Equipa</label>
      <input id="w_ne" type="number" min="0" max="100" value="25">
    </div>
  </div>
  <div id="pesoInfo" class="pill">Ponderações OK (100%)</div>
  <div class="mini">As ponderações influenciam o <strong>Score Global</strong> e a <strong>Conclusão Geral</strong>.</div>

  <label>Comentário sobre o desempenho (texto livre)</label>
  <textarea id="tTrab" placeholder="Ex.: Cumpre as tarefas, mas em picos perde organização e precisa de orientação..."></textarea>

  <label>Comentário sobre a atitude (texto livre)</label>
  <textarea id="tAti" placeholder="Ex.: Postura correta, mas sob pressão comunica menos e evita iniciativa..."></textarea>

  <label>Pontos fortes (separar por ;)</label>
  <textarea id="fortes" placeholder="Ex.: responsabilidade; cuidado com animais; fiabilidade; rigor"></textarea>

  <label>Aspetos a melhorar (separar por ;)</label>
  <textarea id="melhorar" placeholder="Ex.: autonomia; organização; verificação final; comunicação sob pressão"></textarea>

  <div class="hint">
    O texto é gerado com base no que é escrito (tolerando alguns erros).<br>
    Pode editar diretamente o texto do lado direito antes de imprimir o PDF.
  </div>

  <div class="btn-row">
    <button id="btnEx" onclick="preencherExemplo()">Preencher com exemplo</button>
    <button id="btnGerar" onclick="gerar()">Gerar ficha</button>
    <button id="btnEditar" onclick="toggleEdicao()">Ativar edição do texto</button>
    <button id="btnPdf" onclick="window.print()">Imprimir / PDF</button>
  </div>
</section>

<section class="card">
  <div id="gerando">🤖 A gerar avaliação…</div>
  <div class="paper" id="out">(Ficha por gerar)</div>
</section>

</main>

<script>
/* ===================== CONSTANTES / ESTADO ===================== */
const labels = {5:"Muito bom",4:"Bom",3:"Suficiente",2:"Fraco",1:"Muito fraco"};
let edicaoAtiva = false;

let isGenerating = false;
let typingTimer = null;

const recentStarts = [];
const RECENT_LIMIT = 14;

const ultimoExPorTipo = { campo: -1, producao: -1, vendas: -1, contab: -1, finpcg: -1 };

/* ===================== EXEMPLOS (POR ÁREA) ===================== */
const exemplosPorTipo = {
  campo: [
    {
      ano:"2026",
      nome:"João Silva",
      funcao:"Operador de Campo",
      tipo:"campo",
      nd:3, na:4, ne:3,
      tTrab:"Cumpre as tarefas no terreno e executa bem as rotinas, mas quando há várias tarefas em simultâneo perde organização e precisa de orientação para definir prioridades.",
      tAti:"Postura correta e funcional, mas sob pressão comunica menos e evita iniciativa. Precisa de assumir decisões simples no terreno quando o plano muda.",
      fortes:"fiabilidade nas rotinas; cuidado com animais; disponibilidade",
      melhorar:"autonomia; organização; priorização; comunicação sob pressão"
    }
  ],
  producao: [
    {
      ano:"2026",
      nome:"Pedro Santos",
      funcao:"Operador de Produção",
      tipo:"producao",
      nd:3, na:3, ne:3,
      tTrab:"Garante o funcionamento normal do processo, mas em picos de trabalho abranda o ritmo e acumula pendências. Precisa de melhorar resposta quando há alterações ao planeamento.",
      tAti:"No dia a dia é correto, mas em urgências fecha-se na execução e comunica menos. Deve sinalizar constrangimentos mais cedo para evitar atrasos.",
      fortes:"cumprimento de procedimentos; postura profissional; estabilidade",
      melhorar:"gestão de carga; verificação final sob pressão; comunicação em urgências"
    }
  ],
  vendas: [
    {
      ano:"2026",
      nome:"Ana Costa",
      funcao:"Comercial",
      tipo:"vendas",
      nd:3, na:4, ne:3,
      tTrab:"Mantém acompanhamento regular da carteira atual, mas a prospeção é irregular. Em metas mais exigentes abranda e perde seguimento de oportunidades.",
      tAti:"Relaciona-se bem com clientes, mas sob pressão comercial tende a reduzir iniciativa e evita abordagens mais assertivas.",
      fortes:"boa relação com clientes; comunicação; cumprimento do básico",
      melhorar:"proatividade; registo e seguimento; resiliência à pressão comercial"
    }
  ],
  contab: [
    {
      ano:"2026",
      nome:"Carla Nunes",
      funcao:"Contabilista",
      tipo:"contab",
      nd:4, na:3, ne:3,
      tTrab:"Cumpre prazos e assegura registos corretos, mas em picos de trabalho reduz verificação final e surgem inconsistências que exigem correções posteriores.",
      tAti:"Postura profissional, mas em urgências comunica menos e não sinaliza constrangimentos atempadamente.",
      fortes:"atenção ao detalhe; cumprimento de prazos; fiabilidade na rotina",
      melhorar:"verificação sistemática; comunicação em urgências; priorização"
    }
  ],
  finpcg: [
    {
      ano:"2026",
      nome:"Rui Almeida",
      funcao:"Financeiro / PCG",
      tipo:"finpcg",
      nd:3, na:3, ne:3,
      tTrab:"Na rotina mantém controlo aceitável, mas em pedidos urgentes perde ritmo e algumas respostas ficam fora do prazo esperado, afetando a decisão da gestão.",
      tAti:"Postura correta, mas sob pressão tende a fechar-se na execução e partilha informação tarde demais.",
      fortes:"organização base; postura profissional; estabilidade",
      melhorar:"priorização; resposta rápida; sinalização de riscos; comunicação proativa"
    }
  ]
};

function preencherExemplo(){
  if(isGenerating) return;

  const tipo = document.getElementById("tipo").value;
  const pool = exemplosPorTipo[tipo] || exemplosPorTipo.campo;

  let i;
  do { i = Math.floor(Math.random() * pool.length); }
  while (pool.length > 1 && i === ultimoExPorTipo[tipo]);

  ultimoExPorTipo[tipo] = i;
  const e = pool[i];

  ano.value = e.ano;
  nome.value = e.nome;
  funcao.value = e.funcao;
  tipo.value = e.tipo;
  data.value = new Date().toISOString().slice(0,10);

  nd.value = e.nd;
  na.value = e.na;
  ne.value = e.ne;

  tTrab.value = e.tTrab;
  tAti.value = e.tAti;
  fortes.value = e.fortes;
  melhorar.value = e.melhorar;
}

/* ===================== UTILITÁRIOS ===================== */
function escapeHtml(str){
  return (str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[m]));
}
function lista(txt){
  const items = (txt ?? "").split(";").map(t=>t.trim()).filter(Boolean);
  return items.length ? items.map(t=>"• "+escapeHtml(t)).join("<br>") : "—";
}

/* ===================== EDIÇÃO DIRETA ===================== */
function toggleEdicao(){
  if(isGenerating) return;

  edicaoAtiva = !edicaoAtiva;
  const el = document.getElementById("out");
  el.contentEditable = edicaoAtiva ? "true" : "false";
  el.classList.toggle("editable", edicaoAtiva);
  if(edicaoAtiva) el.focus();
}

/* ===================== BOTÕES ===================== */
function setButtonsDisabled(disabled){
  document.getElementById("btnEx").disabled = disabled;
  document.getElementById("btnGerar").disabled = disabled;
  document.getElementById("btnEditar").disabled = disabled;
  document.getElementById("btnPdf").disabled = disabled;
}

/* ===================== SIMULAÇÃO “IA A ESCREVER” ===================== */
function simulateAIGeneration(outEl, htmlFinal){
  const indicador = document.getElementById("gerando");

  if(typingTimer) { clearTimeout(typingTimer); typingTimer = null; }

  indicador.style.display = "block";
  isGenerating = true;
  setButtonsDisabled(true);

  edicaoAtiva = false;
  outEl.contentEditable = "false";
  outEl.classList.remove("editable");

  outEl.innerHTML = `<div id="typingPreview"></div>`;
  const previewEl = document.getElementById("typingPreview");

  const tmp = document.createElement("div");
  tmp.innerHTML = htmlFinal
    .replace(/<\/h1>/gi, "\n\n")
    .replace(/<\/h2>/gi, "\n")
    .replace(/<\/p>/gi, "\n\n")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/div>/gi, "\n")
    .replace(/<\/li>/gi, "\n");

  const fullText = (tmp.innerText || "").replace(/\n{3,}/g, "\n\n").trim();

  let i = 0;

  const base = 9;
  const jitter = () => Math.floor(Math.random() * 12);
  const pauseChance = () => Math.random() < 0.02;
  const pauseTime = () => 120 + Math.floor(Math.random()*220);

  function step(){
    if(i < fullText.length){
      previewEl.textContent = fullText.slice(0, i + 1);
      i++;

      let delay = base + jitter();
      const ch = fullText[i-1];
      if(ch === "." || ch === "," || ch === ";" || ch === ":") delay += 40 + jitter();
      if(ch === "\n") delay += 60 + jitter();
      if(pauseChance()) delay += pauseTime();

      typingTimer = setTimeout(step, delay);
    }else{
      outEl.innerHTML = htmlFinal;

      indicador.style.display = "none";
      isGenerating = false;
      setButtonsDisabled(false);
      typingTimer = null;
    }
  }
  step();
}

/* ===================== PRNG DETERMINÍSTICO ===================== */
function hashString(s){
  s = String(s ?? "");
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function makeRng(seed){
  let x = seed >>> 0;
  return function(){
    x ^= x << 13; x >>>= 0;
    x ^= x >> 17; x >>>= 0;
    x ^= x << 5;  x >>>= 0;
    return (x >>> 0) / 4294967296;
  };
}
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function pickNonRepeatingStart(rng, arr){
  for(let tries=0; tries<10; tries++){
    const cand = pick(rng, arr);
    const key = cand.slice(0, 46).toLowerCase();
    if(!recentStarts.includes(key)){
      recentStarts.push(key);
      while(recentStarts.length > RECENT_LIMIT) recentStarts.shift();
      return cand;
    }
  }
  const fb = pick(rng, arr);
  const key = fb.slice(0, 46).toLowerCase();
  recentStarts.push(key);
  while(recentStarts.length > RECENT_LIMIT) recentStarts.shift();
  return fb;
}

/* ===================== PONDERAÇÕES ===================== */
function numVal(id){
  const x = parseFloat((document.getElementById(id).value ?? "").toString().replace(",", "."));
  return isFinite(x) ? x : 0;
}

function validateWeights(){
  const w1 = Math.max(0, Math.min(100, numVal("w_nd")));
  const w2 = Math.max(0, Math.min(100, numVal("w_na")));
  const w3 = Math.max(0, Math.min(100, numVal("w_ne")));
  const sum = w1 + w2 + w3;

  const info = document.getElementById("pesoInfo");

  if(sum === 100){
    info.textContent = "Ponderações OK (100%)";
    info.classList.remove("warn");
  }else{
    info.textContent = `Atenção: soma = ${sum.toFixed(0)}% (deve ser 100%)`;
    info.classList.add("warn");
  }
  return {w1,w2,w3,sum};
}

// valida em tempo real
["w_nd","w_na","w_ne"].forEach(id=>{
  document.addEventListener("input", (e)=>{
    if(e.target && e.target.id === id) validateWeights();
  });
});

function normalizeWeights(w1,w2,w3){
  const sum = w1+w2+w3;
  if(sum <= 0){
    return {w1:34, w2:33, w3:33, sum:100};
  }
  // normaliza para 100
  const n1 = (w1/sum)*100;
  const n2 = (w2/sum)*100;
  const n3 = 100 - n1 - n2; // fecha 100 certinho
  return {w1:n1, w2:n2, w3:n3, sum:100};
}

function scorePonderado(nd,na,ne,w1,w2,w3){
  return (nd*(w1/100)) + (na*(w2/100)) + (ne*(w3/100));
}

/* ===================== TEXTO DIRETO (geração) ===================== */
function tipoHuman(tipoVal){
  return (
    tipoVal==="campo" ? "CAMPO / OPERAÇÕES PECUÁRIAS" :
    tipoVal==="producao" ? "PRODUÇÃO DE CARNE & LOGÍSTICA" :
    tipoVal==="vendas" ? "VENDAS & MARKETING" :
    tipoVal==="contab" ? "CONTABILIDADE" :
    "FINANCEIRO & PLANEAMENTO E CONTROLO DE GESTÃO"
  );
}

function contexto(tipoVal){
  if(tipoVal==="campo") return "no trabalho no terreno e operação pecuária";
  if(tipoVal==="producao") return "na produção de carne e dinâmica logística";
  if(tipoVal==="vendas") return "na atividade comercial e acompanhamento de clientes";
  if(tipoVal==="contab") return "nos processos contabilísticos e prazos de fecho";
  return "na gestão financeira e suporte à decisão (planeamento e controlo)";
}

function extractAnchors(text){
  const t = (text ?? "").trim();
  if(!t) return [];
  const parts = t.replace(/\s+/g," ").split(/[.!?;]/).map(s=>s.trim()).filter(s=>s.length >= 18);
  const pool = parts.length ? parts : [t.slice(0, 90)];
  pool.sort((a,b)=>b.length-a.length);
  const a1 = pool[0] ? pool[0].slice(0, 120) : "";
  const a2 = pool[1] ? pool[1].slice(0, 95) : "";
  return [a1,a2].filter(Boolean);
}

function buildBlockDireto(rng, title, nota, tipoVal, freeText){
  const ctx = contexto(tipoVal);
  const anchors = extractAnchors(freeText);

  const tone =
    (nota>=4) ? "forte" :
    (nota===3) ? "ok" : "fraco";

  const s1 = pickNonRepeatingStart(rng, [
    `No dia a dia, o desempenho ${ctx} é ${tone==="forte" ? "consistente e acima do esperado" : tone==="ok" ? "adequado para a rotina" : "abaixo do necessário"}.`,
    `De forma geral, o trabalho ${ctx} é ${tone==="forte" ? "sólido e fiável" : tone==="ok" ? "suficiente, mas com limitações" : "irregular e exige correções frequentes"}.`,
    `Ao longo do período avaliado, o desempenho ${ctx} manteve-se ${tone==="forte" ? "bom e previsível" : tone==="ok" ? "aceitável na rotina" : "frágil e inconsistente"}.`
  ]);

  const s2 = tone==="forte"
    ? pick(rng, [
      "Cumpre objetivos e entrega resultados com pouca necessidade de acompanhamento.",
      "Mantém ritmo, método e qualidade de forma estável ao longo do tempo."
    ])
    : tone==="ok"
      ? pick(rng, [
        "Cumpre o essencial e garante o funcionamento normal do dia a dia.",
        "Entrega o básico com estabilidade quando o contexto é previsível."
      ])
      : pick(rng, [
        "Falha no cumprimento do essencial com regularidade e exige acompanhamento próximo.",
        "O trabalho não mantém o nível necessário e gera retrabalho."
      ]);

  const s3 = anchors.length
    ? pick(rng, [
      `Em concreto, ficou registado que ${anchors[0].toLowerCase()}.`,
      `De forma prática, observa-se que ${anchors[0].toLowerCase()}.`
    ])
    : pick(rng, [
      "O período avaliado mostra padrões claros de execução no dia a dia.",
      "A informação recolhida permite identificar com clareza o padrão de trabalho."
    ]);

  const s4 = pick(rng, [
    "Quando o plano se mantém estável, o trabalho avança sem problemas relevantes.",
    "Em condições normais, o fluxo de trabalho mantém-se controlado."
  ]);

  const s5 = tone==="forte"
    ? pick(rng, [
      "Mesmo em picos de trabalho, mantém controlo, organiza prioridades e fecha tarefas corretamente.",
      "Sob pressão, mantém disciplina e evita falhas por falta de verificação."
    ])
    : tone==="ok"
      ? pick(rng, [
        "Quando há pressão ou várias tarefas em simultâneo, perde organização e precisa de orientação para priorizar.",
        "Em períodos mais exigentes, abranda o ritmo e deixa tarefas por fechar."
      ])
      : pick(rng, [
        "Sob pressão, perde controlo do trabalho e aumenta significativamente o número de falhas.",
        "Em situações exigentes, bloqueia, atrasa decisões e não consegue manter o ritmo."
      ]);

  const s6 = tone==="forte"
    ? pick(rng, [
      "Isto reduz risco operacional e dá previsibilidade à equipa e à gestão.",
      "O impacto é positivo: menos correções, menos retrabalho e melhor controlo."
    ])
    : tone==="ok"
      ? pick(rng, [
        "Isto gera atrasos e obriga a intervenções frequentes da chefia para garantir fecho correto.",
        "Isto cria retrabalho e aumenta a carga de acompanhamento."
      ])
      : pick(rng, [
        "Isto compromete prazos, qualidade e aumenta o risco de erros passarem despercebidos.",
        "O impacto é direto: atrasos, correções repetidas e perda de controlo."
      ]);

  const s7 = tone==="forte"
    ? pick(rng, [
      "O perfil mostra autonomia e capacidade para assumir maior responsabilidade.",
      "Está preparado para aumentar autonomia e assumir tarefas com maior exigência."
    ])
    : tone==="ok"
      ? pick(rng, [
        "O perfil é fiável na rotina, mas limitado quando é exigida autonomia.",
        "O desempenho é seguro no básico, mas não aguenta bem contextos de maior exigência."
      ])
      : pick(rng, [
        "O perfil revela limitações que exigem plano corretivo e acompanhamento consistente.",
        "Sem intervenção prática, o padrão atual tende a repetir-se e a manter o problema."
      ]);

  const s8 = tone==="forte"
    ? pick(rng, [
      "Direção: manter o padrão e consolidar autonomia, com foco em método e verificação final.",
      "Direção: manter consistência e reforçar capacidade de apoiar a equipa quando necessário."
    ])
    : tone==="ok"
      ? pick(rng, [
        "Direção: melhorar autonomia, priorização e verificação final, mesmo quando há pressão.",
        "Direção: reduzir dependência da chefia, organizar o trabalho e fechar tarefas sem deixar pendências."
      ])
      : pick(rng, [
        "Direção: definir objetivos corretivos claros e acompanhamento regular, com foco em método, ritmo e qualidade.",
        "Direção: estabilizar execução e reduzir falhas com rotinas de controlo e registo."
      ]);

  const p = [s1,s2,s3,s4,s5,s6,s7,s8].map(s=>String(s).replace(/\s+/g," ").trim()).join(" ");

  return `
  <div class="section">
    <h2>${escapeHtml(title)}: ${nota}/5 — ${labels[nota]}</h2>
    <p>${escapeHtml(p)}</p>
  </div>`;
}

/* ===================== CONCLUSÃO GERAL (com base no score ponderado) ===================== */
function faixaGlobal(score){
  if(score >= 4.25) return "excelente";
  if(score >= 3.25) return "boa";
  if(score >= 2.50) return "suficiente";
  return "fraca";
}

function buildConclusaoGeral(tipoVal, nd, na, ne, score, w1, w2, w3){
  const ctx = contexto(tipoVal);
  const faixa = faixaGlobal(score);

  const p1 = "A presente avaliação reflete o desempenho observado ao longo do período avaliado, considerando os resultados obtidos, o rigor na execução, os comportamentos no trabalho e a capacidade de evolução.";
  const p2 = `Os níveis atribuídos são: Desempenho ${nd}/5 — ${labels[nd]}, Atitude ${na}/5 — ${labels[na]} e Trabalho em Equipa ${ne}/5 — ${labels[ne]}.`;
  const p3 = `Ponderações aplicadas: Desempenho ${w1.toFixed(0)}%, Atitude ${w2.toFixed(0)}%, Equipa ${w3.toFixed(0)}%.`;
  const p4 = `Score Global (ponderado): ${score.toFixed(2)}/5 — ${faixa==="excelente" ? "Muito bom" : faixa==="boa" ? "Bom" : faixa==="suficiente" ? "Suficiente" : "Fraco"}.`;

  const corpo =
    faixa==="excelente" ? [
      `De forma global, o desempenho ${ctx} é consistente e acima do esperado, com impacto positivo no funcionamento diário.`,
      "Mesmo em contextos exigentes, mantém controlo, método e capacidade de resposta, reduzindo necessidade de acompanhamento.",
      "Para o próximo período, recomenda-se consolidar este padrão e aumentar autonomia/impacto em tarefas de maior responsabilidade.",
      "A evolução deverá focar melhoria contínua e transferência de boas práticas para a equipa, mantendo qualidade e ritmo sob pressão."
    ] :
    faixa==="boa" ? [
      `De forma global, o desempenho ${ctx} é bom e fiável, garantindo resultados consistentes na maioria das situações.`,
      "Em momentos de maior pressão podem existir oscilações, mas o padrão geral é positivo e controlado.",
      "Para o próximo período, é importante reforçar autonomia e método nos picos de trabalho, reduzindo necessidade de intervenção da chefia.",
      "A evolução depende de consolidar hábitos de verificação final e priorização para manter consistência em contextos menos previsíveis."
    ] :
    faixa==="suficiente" ? [
      `De forma global, o desempenho ${ctx} cumpre o essencial em contextos estáveis e rotineiros, permitindo continuidade normal das operações.`,
      "No entanto, quando surgem situações de maior pressão, alterações de planeamento ou exigências adicionais, evidenciam-se limitações ao nível da autonomia, da organização e da capacidade de resposta.",
      "Estas limitações têm impacto direto na eficácia do trabalho, no cumprimento de prazos e na carga de acompanhamento por parte da chefia.",
      "Para o próximo período, é fundamental reforçar autonomia, priorização e aplicação consistente de métodos de trabalho, mesmo sob pressão."
    ] : [
      `De forma global, o desempenho ${ctx} está abaixo do necessário e não garante consistência nem controlo ao longo do período.`,
      "As falhas repetidas e a resposta insuficiente sob pressão comprometem prazos, qualidade e aumentam o retrabalho.",
      "É necessário definir um plano corretivo com objetivos claros, acompanhamento regular e verificação frequente de evolução.",
      "A continuidade e progressão dependem de melhorias concretas em método de trabalho, rigor e capacidade de resposta."
    ];

  const p = [p1,p2,p3,p4,...corpo].join(" ");

  return `
  <div class="section">
    <h2>Conclusão Geral</h2>
    <p>${escapeHtml(p)}</p>
  </div>`;
}

/* ===================== GERAR ===================== */
function gerar(){
  if(isGenerating) return;

  const v = id => (document.getElementById(id).value ?? "").trim();

  const anoVal = v("ano");
  const nomeVal = v("nome");
  const funcaoVal = v("funcao");
  const tipoVal = v("tipo");
  const dataVal = v("data");

  if(!anoVal){
    alert("O campo ANO DA AVALIAÇÃO é obrigatório.");
    document.getElementById("ano").focus();
    return;
  }
  if(!/^\d{4}$/.test(anoVal)){
    alert("O ANO DA AVALIAÇÃO deve ter 4 dígitos (ex.: 2026).");
    document.getElementById("ano").focus();
    return;
  }
  if(!nomeVal){
    alert("O campo Nome é obrigatório.");
    document.getElementById("nome").focus();
    return;
  }
  if(!funcaoVal){
    alert("O campo Função é obrigatório.");
    document.getElementById("funcao").focus();
    return;
  }
  if(!dataVal){
    alert("O campo Data é obrigatório.");
    document.getElementById("data").focus();
    return;
  }

  const ndVal = parseInt(document.getElementById("nd").value,10);
  const naVal = parseInt(document.getElementById("na").value,10);
  const neVal = parseInt(document.getElementById("ne").value,10);

  const tTrabTxt = v("tTrab");
  const tAtiTxt  = v("tAti");
  const fortesTxt = v("fortes");
  const melhorarTxt = v("melhorar");

  // ponderações
  const raw = validateWeights();
  const norm = (raw.sum === 100) ? raw : normalizeWeights(raw.w1, raw.w2, raw.w3);

  // se normalizou, reflete nos inputs (para ficar transparente)
  if(raw.sum !== 100){
    document.getElementById("w_nd").value = norm.w1.toFixed(0);
    document.getElementById("w_na").value = norm.w2.toFixed(0);
    document.getElementById("w_ne").value = norm.w3.toFixed(0);
    validateWeights();
  }

  const score = scorePonderado(ndVal, naVal, neVal, norm.w1, norm.w2, norm.w3);

  const seed = hashString([anoVal,nomeVal,funcaoVal,dataVal,tipoVal,ndVal,naVal,neVal,tTrabTxt,tAtiTxt,fortesTxt,melhorarTxt, norm.w1,norm.w2,norm.w3].join("|"));
  const rng = makeRng(seed);

  const blocoDesempenho = buildBlockDireto(rng, "Nível de Desempenho", ndVal, tipoVal, tTrabTxt);
  const blocoAtitude    = buildBlockDireto(rng, "Nível de Atitude no Trabalho", naVal, tipoVal, tAtiTxt);
  const blocoEquipa     = buildBlockDireto(rng, "Trabalho em Equipa", neVal, tipoVal, (tAtiTxt || tTrabTxt));

  const conclusaoGeral = buildConclusaoGeral(tipoVal, ndVal, naVal, neVal, score, norm.w1, norm.w2, norm.w3);

  const htmlFinal = `
  <div class="pdf-header">
    <img src="logo-monte-do-pasto.png" alt="Monte do Pasto">
    <div>
      <h1 style="margin:0;">Monte do Pasto — Avaliação Anual</h1>
    </div>
  </div>

  <p>
    <strong>Ano da Avaliação:</strong> ${escapeHtml(anoVal)}<br>
    <strong>Colaborador:</strong> ${escapeHtml(nomeVal)}<br>
    <strong>Função:</strong> ${escapeHtml(funcaoVal)}<br>
    <strong>Área (Tipo):</strong> ${escapeHtml(tipoHuman(tipoVal))}<br>
    <strong>Data:</strong> ${escapeHtml(dataVal)}<br>
    <strong>Score Global (ponderado):</strong> ${score.toFixed(2)}/5
  </p>

  ${blocoDesempenho}
  ${blocoAtitude}
  ${blocoEquipa}

  <div class="section">
    <h2>Pontos Fortes</h2>
    <p>${lista(fortesTxt)}</p>
  </div>

  <div class="section">
    <h2>Aspetos a Melhorar</h2>
    <p>${lista(melhorarTxt)}</p>
  </div>

  ${conclusaoGeral}

  <div class="section">
    <p><strong>Data:</strong> ____________________________</p>
    <p><strong>Assinatura do Colaborador:</strong><br><br>______________________________</p>
    <p><strong>Assinatura da Chefia:</strong><br><br>______________________________</p>
  </div>

  <div class="footer-doc">
    TPL Avaliação Monte do Pasto
  </div>
  `;

  const out = document.getElementById("out");
  simulateAIGeneration(out, htmlFinal);
}

// inicializa indicador
validateWeights();
</script>
