<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte do Pasto — Avaliação Anual</title>

<style>
/* ================= BASE APP ================= */
:root{
  --bg:#f4f5f2;
  --card:#ffffff;
  --text:#2b2b2b;
  --muted:#6f6f6f;
  --accent:#2e7d32;
  --border:#dcdcdc;
  --shadow:0 8px 20px rgba(0,0,0,.08);
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg);
  color:var(--text);
}

header{
  text-align:center;
  padding:36px 20px 24px;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.logo{
  max-height:140px;
  margin-bottom:16px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:10px auto 0;
  max-width:760px;
  color:var(--muted);
}

main{
  max-width:1100px;
  margin:0 auto;
  padding:28px 20px 60px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

@media(max-width:900px){
  main{grid-template-columns:1fr}
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

h2{
  margin:0 0 14px;
  font-size:17px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-size:13px;
  color:var(--muted);
}

input,select,textarea{
  width:100%;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#fafafa;
  font-size:14px;
}

textarea{min-height:100px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
}

.actions{
  margin-top:16px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  padding:10px 16px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#f0f0f0;
  font-weight:600;
  cursor:pointer;
}

button.primary{
  background:var(--accent);
  color:#fff;
  border:none;
}

button.secondary{
  background:#fff;
}

.paper{
  background:#fff;
  color:#111;
  padding:30px;
  border-radius:12px;
  border:1px solid var(--border);
  max-height:70vh;
  overflow:auto;
  white-space:pre-wrap;
  font-family:Georgia,"Times New Roman",serif;
  line-height:1.65;
}

/* ================= PDF / PRINT ================= */
@media print{

  body{
    background:#fff;
    font-family:"Times New Roman", Georgia, serif;
    font-size:12pt;
    color:#000;
  }

  header, .card.form, .actions{
    display:none !important;
  }

  main{
    display:block;
    padding:0;
    margin:0;
  }

  .paper{
    border:none;
    padding:0;
    max-height:none;
    line-height:1.6;
  }

  .paper h3{
    margin-top:24px;
    margin-bottom:6px;
    font-size:14pt;
    border-bottom:1px solid #000;
    padding-bottom:4px;
  }

  .paper .meta{
    margin-bottom:20px;
  }

  .paper .meta p{
    margin:4px 0;
  }

  .paper .section{
    margin-bottom:18px;
  }

}
</style>
</head>

<body>

<header>
  <img src="logo-monte-do-pasto.png" alt="Monte do Pasto" class="logo">
  <h1>Avaliação Anual de Colaboradores</h1>
  <p>Ferramenta interna para avaliação estruturada e profissional.</p>
</header>

<main>

<section class="card form">
<h2>Dados do colaborador</h2>

<div class="grid">
  <div><label>Nome</label><input id="nome"></div>
  <div><label>Função</label><input id="funcao"></div>
  <div>
    <label>Tipo de função</label>
    <select id="tipo">
      <option value="campo">Operacional / Campo</option>
      <option value="admin">Administrativa / Apoio</option>
    </select>
  </div>
  <div><label>Data</label><input type="date" id="data"></div>
</div>

<h2 style="margin-top:20px">Avaliação com nota</h2>

<div class="grid">
  <div>
    <label>Nível de Desempenho (1–5)</label>
    <select id="nd">
      <option value="5">5 — Muito bom</option>
      <option value="4">4 — Bom</option>
      <option value="3" selected>3 — Suficiente</option>
      <option value="2">2 — Fraco</option>
      <option value="1">1 — Muito fraco</option>
    </select>
  </div>
  <div>
    <label>Nível de Atitude no Trabalho (1–5)</label>
    <select id="na">
      <option value="5">5 — Muito boa</option>
      <option value="4">4 — Boa</option>
      <option value="3" selected>3 — Suficiente</option>
      <option value="2">2 — Fraca</option>
      <option value="1">1 — Muito fraca</option>
    </select>
  </div>
</div>

<label>Comentário sobre o trabalho realizado</label>
<textarea id="tTrab"></textarea>

<label>Comentário sobre a atitude no trabalho</label>
<textarea id="tAti"></textarea>

<label>Pontos fortes</label>
<textarea id="fortes"></textarea>

<label>Aspetos a melhorar</label>
<textarea id="melhorar"></textarea>

<div class="actions">
  <button class="secondary" onclick="preencherExemplo()">Preencher com exemplo</button>
  <button class="primary" onclick="gerar()">Gerar ficha</button>
  <button onclick="window.print()">Imprimir / PDF</button>
</div>
</section>

<section class="card">
<h2>Ficha gerada</h2>
<div class="paper" id="out">(À espera de dados)</div>
</section>

</main>

<script>
/* ================= TEXTO LONGO ================= */

const mapaNota = {
  5:"Muito bom",
  4:"Bom",
  3:"Suficiente",
  2:"Fraco",
  1:"Muito fraco"
};

function bloco(titulo, texto){
  return `<h3>${titulo}</h3><div class="section">${texto}</div>`;
}

/* ================= EXEMPLOS ================= */
const exemplos=[
  {
    nome:"João Silva",
    funcao:"Trabalhador Agrícola",
    tipo:"campo",
    nd:3,
    na:4,
    tTrab:"Cumpre as tarefas atribuídas com regularidade, embora possa melhorar a organização do trabalho.",
    tAti:"Mantém uma atitude positiva e colaborativa.",
    fortes:"Responsabilidade; disponibilidade; adaptação ao trabalho no terreno.",
    melhorar:"Organização do trabalho; atenção ao detalhe."
  }
];

function preencherExemplo(){
  const e=exemplos[Math.floor(Math.random()*exemplos.length)];
  nome.value=e.nome;
  funcao.value=e.funcao;
  tipo.value=e.tipo;
  data.value=new Date().toISOString().slice(0,10);
  nd.value=e.nd;
  na.value=e.na;
  tTrab.value=e.tTrab;
  tAti.value=e.tAti;
  fortes.value=e.fortes;
  melhorar.value=e.melhorar;
}

/* ================= GERAR ================= */
function gerar(){
  const v=id=>document.getElementById(id).value;
  const ndVal=parseInt(v("nd"));
  const naVal=parseInt(v("na"));

  out.innerHTML = `
<div class="meta">
<p><strong>Colaborador:</strong> ${v("nome")}</p>
<p><strong>Função:</strong> ${v("funcao")}</p>
<p><strong>Tipo de função:</strong> ${v("tipo")==="campo"?"Operacional / Campo":"Administrativa / Apoio"}</p>
<p><strong>Data:</strong> ${v("data")}</p>
</div>

${bloco(
  `Nível de Desempenho: ${ndVal}/5 — ${mapaNota[ndVal]}`,
  `Ao longo do período avaliado, o colaborador demonstrou um nível de desempenho enquadrado como ${mapaNota[ndVal].toLowerCase()}. 
   ${v("tTrab")} 
   De forma global, o desempenho apresentado é coerente com a classificação atribuída, existindo margem para consolidação futura.`
)}

${bloco(
  `Nível de Atitude no Trabalho: ${naVal}/5 — ${mapaNota[naVal]}`,
  `No que respeita à atitude no trabalho, foi observada uma postura ${mapaNota[naVal].toLowerCase()}. 
   ${v("tAti")} 
   A atitude demonstrada contribui para o enquadramento geral da avaliação.`
)}

${bloco(
  "Pontos Fortes",
  v("fortes")
)}

${bloco(
  "Aspetos a Melhorar",
  v("melhorar")
)}

${bloco(
  "Conclusão e Objetivos",
  "A avaliação global reflete o desempenho e a atitude observados ao longo do período analisado. " +
  "Os pontos fortes identificados deverão ser mantidos e consolidados. " +
  "Os aspetos a melhorar constituem áreas de desenvolvimento prioritárias para o próximo período. " +
  "Esta avaliação deverá servir de base para acompanhamento e definição de objetivos futuros."
)}
`;
}
</script>

</body>
</html>
