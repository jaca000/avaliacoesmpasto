<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte do Pasto — Avaliação Anual</title>

<style>
/* ================= SISTEMA VISUAL ================= */
:root{
  --bg:#ecefe8;
  --panel:#ffffff;
  --paper:#fdfdfb;
  --primary:#243f2e;
  --accent:#8fae96;
  --text:#1e2a22;
  --muted:#6b7c72;
  --border:#d9dfd6;
}

/* ================= BASE ================= */
body{
  margin:0;
  font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  background:
    radial-gradient(1200px 600px at 10% -10%, #f3f6f0, transparent),
    radial-gradient(900px 500px at 90% 10%, #eef2eb, transparent),
    var(--bg);
  color:var(--text);
}

header{
  display:flex;
  align-items:center;
  gap:18px;
  padding:28px 32px;
  background:#fff;
  border-bottom:1px solid var(--border);
}

header img{height:56px}

header h1{
  font-size:22px;
  margin:0;
  letter-spacing:.3px;
  color:var(--primary);
}

/* ================= LAYOUT ================= */
main{
  max-width:1400px;
  margin:0 auto;
  padding:32px;
  display:grid;
  grid-template-columns:420px 1fr;
  gap:32px;
}

@media(max-width:1100px){
  main{grid-template-columns:1fr}
}

/* ================= FORM ================= */
.form{
  background:var(--panel);
  border-radius:18px;
  padding:28px;
  border:1px solid var(--border);
}

.form h2{
  margin:0 0 18px;
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--muted);
}

label{
  display:block;
  margin-top:14px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
}

input,select,textarea{
  width:100%;
  margin-top:6px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#fafcf9;
  font-size:14px;
}

textarea{min-height:96px}

.actions{
  margin-top:22px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

button{
  padding:10px 18px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#f2f5f0;
  color:var(--primary);
  font-weight:600;
  cursor:pointer;
}

/* ================= PREVIEW DOCUMENT ================= */
.preview{
  background:var(--paper);
  border-radius:20px;
  border:1px solid var(--border);
  display:grid;
  grid-template-columns:64px 1fr;
  overflow:hidden;
}

.preview-bar{
  background:linear-gradient(180deg,var(--primary),#1c2f23);
}

.paper{
  padding:42px 48px;
  font-family:Georgia,"Times New Roman",serif;
  line-height:1.75;
}

/* ================= SECTIONS ================= */
.section{
  margin-bottom:26px;
}

.section h2{
  margin:0 0 10px;
  font-size:15px;
  color:var(--primary);
  text-transform:uppercase;
  letter-spacing:.08em;
  border-bottom:1px solid var(--border);
  padding-bottom:6px;
}

.meta{
  margin-bottom:28px;
  font-size:14px;
}

/* ================= PDF ================= */
.pdf-header{display:none}

@page{size:A4;margin:25mm 20mm}

@media print{
  body{background:#fff}
  header,.form,button{display:none}
  main{display:block;padding:0}
  .preview{display:block;border:none}
  .preview-bar{display:none}
  .paper{padding:0}

  .pdf-header{
    display:flex;
    align-items:center;
    border-bottom:2px solid #000;
    padding-bottom:10px;
    margin-bottom:22px;
  }

  .pdf-header img{height:60px;margin-right:18px}
  .pdf-header h1{font-size:18pt;margin:0}

  .section{page-break-inside:avoid}
}
</style>
</head>

<body>

<header>
  <img src="logo-monte-do-pasto.png">
  <h1>Avaliação Anual de Colaboradores</h1>
</header>

<main>

<section class="form">
<h2>Dados da Avaliação</h2>

<label>Nome</label><input id="nome">
<label>Função</label><input id="funcao">

<label>Tipo de função</label>
<select id="tipo">
  <option value="campo">Operacional / Campo</option>
  <option value="admin">Administrativa / Apoio</option>
</select>

<label>Data</label><input type="date" id="data">

<label>Nível de Desempenho</label>
<select id="nd">
  <option value="5">5 — Muito bom</option>
  <option value="4">4 — Bom</option>
  <option value="3" selected>3 — Suficiente</option>
  <option value="2">2 — Fraco</option>
  <option value="1">1 — Muito fraco</option>
</select>

<label>Nível de Atitude no Trabalho</label>
<select id="na">
  <option value="5">5 — Muito boa</option>
  <option value="4">4 — Boa</option>
  <option value="3" selected>3 — Suficiente</option>
  <option value="2">2 — Fraca</option>
  <option value="1">1 — Muito fraca</option>
</select>

<label>Comentário Desempenho</label><textarea id="tTrab"></textarea>
<label>Comentário Atitude</label><textarea id="tAti"></textarea>
<label>Pontos Fortes (;)</label><textarea id="fortes"></textarea>
<label>Aspetos a Melhorar (;)</label><textarea id="melhorar"></textarea>

<div class="actions">
<button onclick="preencherExemplo()">Exemplo</button>
<button onclick="gerar()">Gerar ficha</button>
<button onclick="window.print()">PDF</button>
</div>
</section>

<section class="preview">
<div class="preview-bar"></div>
<div class="paper" id="out">(Ficha por gerar)</div>
</section>

</main>

<script>
/* Lógica igual à versão congelada */
</script>

</body>
</html>
